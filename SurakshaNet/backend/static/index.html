<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SurakshaNet — Privacy-Preserving Community Health Intelligence</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            },
            status: {
              normal: '#22c55e', // Green
              watch: '#f59e0b',  // Amber
              verify: '#6366f1', // Indigo / Purple
              elevated: '#ef4444', // Red
              suppressed: '#6b7280', // Gray
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    h1, h2, h3, .font-display {
      font-family: 'Outfit', sans-serif;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>

  <!-- React & DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel CDN (for JSX compilation in-browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="text-slate-900">

  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = "http://127.0.0.1:8000/api";

    function App() {
      // States
      const [currentView, setCurrentView] = useState('landing');
      const [areas, setAreas] = useState([]);
      const [selectedArea, setSelectedArea] = useState('cda_sector_9');
      const [areaDetails, setAreaDetails] = useState(null);
      const [scenarios, setScenarios] = useState({ active: 'Normal', available: [] });
      const [privacyAudits, setPrivacyAudits] = useState([]);
      const [loading, setLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState(null);

      // Local Privacy Node simulator states
      const [localNodeEpsilon, setLocalNodeEpsilon] = useState(1.0);
      const [localNodeSensitivity, setLocalNodeSensitivity] = useState(1.0);
      const [localMinGroupSize, setLocalMinGroupSize] = useState(10);
      const [localRecords, setLocalRecords] = useState([
        { patient_id: "P101", age: 24, hostel: "Hostel A", symptom: "Fever" },
        { patient_id: "P102", age: 19, hostel: "Hostel B", symptom: "Diarrhea" },
        { patient_id: "P103", age: 31, hostel: "Hostel A", symptom: "Diarrhea" },
        { patient_id: "P104", age: 22, hostel: "Hostel C", symptom: "Cough" },
        { patient_id: "P105", age: 25, hostel: "Hostel B", symptom: "Diarrhea" },
        { patient_id: "P106", age: 29, hostel: "Hostel A", symptom: "Diarrhea" },
        { patient_id: "P107", age: 21, hostel: "Hostel D", symptom: "Diarrhea" },
        { patient_id: "P108", age: 20, hostel: "Hostel C", symptom: "Fever" },
        { patient_id: "P109", age: 23, hostel: "Hostel B", symptom: "Diarrhea" },
        { patient_id: "P110", age: 18, hostel: "Hostel A", symptom: "Diarrhea" },
        { patient_id: "P111", age: 27, hostel: "Hostel C", symptom: "Diarrhea" },
      ]);
      const [newPatient, setNewPatient] = useState({ patient_id: "P112", age: 20, hostel: "Hostel A", symptom: "Diarrhea" });
      const [localAggregationResult, setLocalAggregationResult] = useState(null);

      // DP Math Demo states
      const [dpInputValue, setDpInputValue] = useState(50.0);
      const [dpEpsilon, setDpEpsilon] = useState(1.0);
      const [dpSensitivity, setDpSensitivity] = useState(1.0);
      const [dpResult, setDpResult] = useState(null);

      // Refs for Chart.js
      const trendChartRef = useRef(null);
      const xaiChartRef = useRef(null);
      let trendChartInstance = null;
      let xaiChartInstance = null;

      // Initialize
      useEffect(() => {
        fetchScenarios();
        fetchAreas();
        // Load initial math demo
        runDpMathDemo();
      }, []);

      // Trigger when selectedArea or view changes
      useEffect(() => {
        if (selectedArea && (currentView === 'officer' || currentView === 'citizen')) {
          fetchAreaDetails(selectedArea);
          if (currentView === 'officer') {
            fetchPrivacyAudits(selectedArea);
          }
        }
      }, [selectedArea, currentView]);

      // Re-render charts when area details change
      useEffect(() => {
        if (areaDetails && currentView === 'officer') {
          renderTrendChart();
          renderXaiChart();
        }
        // Cleanup charts on unmount/re-render
        return () => {
          destroyCharts();
        };
      }, [areaDetails, currentView]);

      // Helper to destroy Chart.js instances
      const destroyCharts = () => {
        const trendCanvas = document.getElementById('trendChart');
        if (trendCanvas) {
          const chart = Chart.getChart(trendCanvas);
          if (chart) chart.destroy();
        }
        const xaiCanvas = document.getElementById('xaiChart');
        if (xaiCanvas) {
          const chart = Chart.getChart(xaiCanvas);
          if (chart) chart.destroy();
        }
      };

      // API calls
      const fetchScenarios = async () => {
        try {
          const res = await fetch(`${API_BASE}/scenarios`);
          const data = await res.json();
          setScenarios(data);
        } catch (e) {
          console.error("Error fetching scenarios", e);
        }
      };

      const fetchAreas = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/areas`);
          if (!res.ok) throw new Error("Could not fetch areas");
          const data = await res.json();
          setAreas(data);
          setErrorMessage(null);
        } catch (e) {
          setErrorMessage("Failed to connect to backend server. Make sure FastAPI is running on port 8000.");
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const fetchAreaDetails = async (areaId) => {
        try {
          const res = await fetch(`${API_BASE}/areas/${areaId}`);
          if (!res.ok) throw new Error("Could not fetch area details");
          const data = await res.json();
          setAreaDetails(data);
        } catch (e) {
          console.error(e);
        }
      };

      const fetchPrivacyAudits = async (areaId) => {
        try {
          const res = await fetch(`${API_BASE}/areas/${areaId}/privacy`);
          const data = await res.json();
          setPrivacyAudits(data);
        } catch (e) {
          console.error(e);
        }
      };

      const handleScenarioChange = async (scenarioName) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/scenarios/activate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scenario_name: scenarioName })
          });
          if (res.ok) {
            await fetchScenarios();
            await fetchAreas();
            if (selectedArea) {
              await fetchAreaDetails(selectedArea);
              await fetchPrivacyAudits(selectedArea);
            }
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Run differential privacy math demo
      const runDpMathDemo = async () => {
        try {
          const res = await fetch(`${API_BASE}/privacy/protect?value=${dpInputValue}&epsilon=${dpEpsilon}&sensitivity=${dpSensitivity}`, {
            method: 'POST'
          });
          const data = await res.json();
          setDpResult(data);
        } catch (e) {
          console.error(e);
        }
      };

      // Handle local aggregation simulation
      const handleLocalAggregateSubmit = async () => {
        try {
          const res = await fetch(`${API_BASE}/local-data/aggregate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              area_id: selectedArea,
              records: localRecords,
              epsilon: localNodeEpsilon,
              sensitivity: localNodeSensitivity,
              min_group_size: localMinGroupSize
            })
          });
          const data = await res.json();
          setLocalAggregationResult(data);
          // Refresh audits
          fetchPrivacyAudits(selectedArea);
        } catch (e) {
          console.error(e);
        }
      };

      // Charts Render
      const renderTrendChart = () => {
        const ctx = document.getElementById('trendChart');
        if (!ctx || !areaDetails || areaDetails.status === "SUPPRESSED") return;

        destroyCharts();

        const labels = areaDetails.signals.map(s => s.name);
        const observedData = areaDetails.signals.map(s => s.observed);
        const baselineData = areaDetails.signals.map(s => s.baseline_mean);
        const stdDevs = areaDetails.signals.map(s => s.baseline_std);

        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Observed Value',
                data: observedData,
                backgroundColor: 'rgba(2, 132, 199, 0.85)',
                borderColor: 'rgb(2, 132, 199)',
                borderWidth: 1,
                borderRadius: 4
              },
              {
                label: 'Historical Mean',
                data: baselineData,
                backgroundColor: 'rgba(203, 213, 225, 0.6)',
                borderColor: 'rgb(148, 163, 184)',
                borderWidth: 1,
                borderRadius: 4,
                borderDash: [4, 4]
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: '#f1f5f9' },
                title: { display: true, text: 'Value / Count' }
              },
              x: {
                grid: { display: false }
              }
            },
            plugins: {
              legend: { position: 'top', labels: { boxWidth: 12, font: { family: 'Inter' } } }
            }
          }
        });
      };

      const renderXaiChart = () => {
        const ctx = document.getElementById('xaiChart');
        if (!ctx || !areaDetails || areaDetails.status === "SUPPRESSED") return;

        const sortedContributions = Object.entries(areaDetails.contributions)
          .sort((a, b) => b[1] - a[1]);

        const labels = sortedContributions.map(([id]) => {
          const sig = areaDetails.signals.find(s => s.id === id);
          return sig ? sig.name : id;
        });
        const values = sortedContributions.map(([, val]) => val);

        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: values,
              backgroundColor: [
                '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#6366f1',
                '#ec4899', '#8b5cf6', '#14b8a6', '#f43f5e', '#a855f7'
              ],
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: { boxWidth: 10, font: { size: 11, family: 'Inter' } }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return ` ${context.label}: ${context.raw}%`;
                  }
                }
              }
            }
          }
        });
      };

      // UI helpers
      const getStatusClass = (status) => {
        switch (status) {
          case 'NORMAL': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
          case 'WATCH': return 'bg-amber-50 text-amber-700 border-amber-200';
          case 'VERIFY': return 'bg-indigo-50 text-indigo-700 border-indigo-200';
          case 'ELEVATED': return 'bg-rose-50 text-rose-700 border-rose-200';
          case 'SUPPRESSED': return 'bg-slate-100 text-slate-600 border-slate-200';
          default: return 'bg-slate-50 text-slate-600 border-slate-200';
        }
      };

      const getStatusColor = (status) => {
        switch (status) {
          case 'NORMAL': return 'text-emerald-500';
          case 'WATCH': return 'text-amber-500';
          case 'VERIFY': return 'text-indigo-500';
          case 'ELEVATED': return 'text-rose-500';
          default: return 'text-slate-400';
        }
      };

      return (
        <div class="min-h-screen flex flex-col font-sans">
          {/* Header */}
          <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentView('landing')}>
                  <div class="h-10 w-10 bg-sky-600 rounded-lg flex items-center justify-center text-white shadow-md shadow-sky-600/30">
                    <span class="font-bold text-xl tracking-tight">S</span>
                  </div>
                  <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-800">SurakshaNet</h1>
                    <p class="text-xs text-slate-500 font-medium">Privacy-Preserving Health Analytics</p>
                  </div>
                </div>
                
                {/* Navigation Links */}
                <nav class="hidden md:flex space-x-6 text-sm font-semibold">
                  <button 
                    onClick={() => setCurrentView('landing')} 
                    class={`py-2 px-1 border-b-2 transition-colors ${currentView === 'landing' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-600 hover:text-slate-800'}`}>
                    Overview
                  </button>
                  <button 
                    onClick={() => setCurrentView('citizen')} 
                    class={`py-2 px-1 border-b-2 transition-colors ${currentView === 'citizen' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-600 hover:text-slate-800'}`}>
                    Citizen View
                  </button>
                  <button 
                    onClick={() => setCurrentView('officer')} 
                    class={`py-2 px-1 border-b-2 transition-colors ${currentView === 'officer' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-600 hover:text-slate-800'}`}>
                    Officer Dashboard
                  </button>
                  <button 
                    onClick={() => setCurrentView('privacy-node')} 
                    class={`py-2 px-1 border-b-2 transition-colors ${currentView === 'privacy-node' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-600 hover:text-slate-800'}`}>
                    Local Privacy Node
                  </button>
                </nav>

                {/* Scenario Controller */}
                <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-lg border border-slate-200">
                  <span class="text-xs font-bold text-slate-500 uppercase px-1">Scenario:</span>
                  <select 
                    value={scenarios.active}
                    onChange={(e) => handleScenarioChange(e.target.value)}
                    class="bg-white border border-slate-200 rounded text-xs font-semibold py-1 px-2.5 text-slate-700 shadow-sm focus:outline-none focus:ring-1 focus:ring-sky-500">
                    {scenarios.available.map(name => (
                      <option key={name} value={name}>{name}</option>
                    ))}
                  </select>
                </div>
              </div>
            </div>
          </header>

          {/* Error Banner */}
          {errorMessage && (
            <div class="bg-rose-50 border-b border-rose-200 text-rose-700 px-4 py-3 text-center text-sm font-medium">
              ⚠️ {errorMessage}
            </div>
          )}

          {/* Main content */}
          <main class="flex-grow">
            
            {/* VIEW 1: LANDING PAGE */}
            {currentView === 'landing' && (
              <div>
                {/* Hero Section */}
                <section class="py-16 bg-gradient-to-b from-sky-50 via-sky-50/30 to-white border-b border-slate-100">
                  <div class="max-w-4xl mx-auto text-center px-4">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-800 mb-6">
                      Smart India Hackathon Prototype
                    </span>
                    <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 mb-6 leading-tight">
                      Detect Community Health Alerts <br/>
                      <span class="text-sky-600">Without Centralizing Personal Records</span>
                    </h2>
                    <p class="text-lg text-slate-600 mb-8 max-w-2xl mx-auto leading-relaxed">
                      SurakshaNet demonstrates disease and symptom anomaly detection. By processing data locally at clinics and applying differential privacy, the central model receives <strong>only protected aggregates</strong>.
                    </p>
                    <div class="flex flex-wrap justify-center gap-4">
                      <button 
                        onClick={() => { setCurrentView('officer'); setSelectedArea('cda_sector_9'); }}
                        class="bg-sky-600 hover:bg-sky-700 text-white font-semibold px-6 py-3 rounded-lg shadow-lg hover:shadow-sky-600/20 transition-all">
                        Launch Officer Dashboard
                      </button>
                      <button 
                        onClick={() => setCurrentView('citizen')}
                        class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-semibold px-6 py-3 rounded-lg transition-colors">
                        Enter Citizen Portal
                      </button>
                    </div>
                  </div>
                </section>

                {/* Architecture Visualizer */}
                <section class="py-16 max-w-5xl mx-auto px-4">
                  <h3 class="text-2xl font-bold text-center text-slate-800 mb-12">How SurakshaNet Secures Data (Privacy Pipeline)</h3>
                  
                  <div class="grid grid-cols-1 md:grid-cols-5 gap-6 relative">
                    {/* Pipeline Card 1 */}
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center text-center relative z-10">
                      <div class="h-10 w-10 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center mb-3">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                      </div>
                      <h4 class="font-bold text-slate-800 text-sm">Local Sources</h4>
                      <p class="text-xs text-slate-500 mt-2">Clinic electronic medical records, pharmacies, and environmental monitors generate raw data.</p>
                    </div>

                    {/* Arrow 1 */}
                    <div class="hidden md:flex items-center justify-center text-slate-400">
                      <svg class="h-6 w-6 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>

                    {/* Pipeline Card 2 */}
                    <div class="bg-sky-600 p-5 rounded-xl text-white shadow-md flex flex-col items-center text-center relative z-10">
                      <div class="h-10 w-10 bg-white/20 text-white rounded-lg flex items-center justify-center mb-3">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                      </div>
                      <h4 class="font-bold text-sm">Privacy Layer</h4>
                      <p class="text-xs text-sky-100 mt-2">Removes patient PII, scrubs names, applies Laplace noise, and suppresses count values below 10.</p>
                    </div>

                    {/* Arrow 2 */}
                    <div class="hidden md:flex items-center justify-center text-slate-400">
                      <svg class="h-6 w-6 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>

                    {/* Pipeline Card 3 */}
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center text-center relative z-10">
                      <div class="h-10 w-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center mb-3">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2" /></svg>
                      </div>
                      <h4 class="font-bold text-slate-800 text-sm">Central Analytics</h4>
                      <p class="text-xs text-slate-500 mt-2">Only receives protected aggregates. Evaluates anomaly scores, multi-signal weights, and triggers health alerts.</p>
                    </div>
                  </div>
                </section>

                {/* Features & Disclaimers */}
                <section class="bg-slate-100 py-16 border-t border-slate-200">
                  <div class="max-w-5xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                      <h4 class="text-lg font-bold text-slate-800 mb-3">Key Prototype Features</h4>
                      <ul class="space-y-2.5 text-sm text-slate-600 font-medium">
                        <li class="flex items-center"><span class="h-2 w-2 rounded-full bg-sky-600 mr-2.5"></span> Differential Privacy Laplace mechanism.</li>
                        <li class="flex items-center"><span class="h-2 w-2 rounded-full bg-sky-600 mr-2.5"></span> Small Group suppression threshold configuration.</li>
                        <li class="flex items-center"><span class="h-2 w-2 rounded-full bg-sky-600 mr-2.5"></span> Anomaly detection baseline Z-score and Isolation Forest indices.</li>
                        <li class="flex items-center"><span class="h-2 w-2 rounded-full bg-sky-600 mr-2.5"></span> Multi-signal triangulation protecting against isolated reporting anomalies.</li>
                        <li class="flex items-center"><span class="h-2 w-2 rounded-full bg-sky-600 mr-2.5"></span> Explainable AI (XAI) feature contribution breakdown.</li>
                      </ul>
                    </div>

                    <div>
                      <h4 class="text-lg font-bold text-slate-800 mb-3">Prototype Disclaimers</h4>
                      <div class="bg-white p-4 rounded-lg border border-slate-200 text-xs text-slate-500 space-y-2 leading-relaxed">
                        <p class="font-bold text-slate-700">⚠️ FOR DEMONSTRATION PURPOSES ONLY</p>
                        <p>All data and observations visualized inside this application are synthetically generated. This is a hackathon proof of concept to demonstrate privacy mechanics.</p>
                        <p>SurakshaNet is a statistical decision-support system and does not predict outbreak curves with medical certainty or replace certified public health officers.</p>
                        <p class="italic">"Detect the signal, not the person."</p>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* VIEW 2: CITIZEN VIEW */}
            {currentView === 'citizen' && (
              <div class="max-w-4xl mx-auto py-12 px-4">
                <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-xl mx-auto">
                  <h3 class="text-2xl font-bold text-slate-800 mb-2">Citizen Health Portal</h3>
                  <p class="text-sm text-slate-500 mb-6">Check general health status indicators and precautions recommended in your area.</p>

                  <div class="mb-6">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Select Your Region</label>
                    <select

                          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Age</label>
                          <input 
                            type="number" 
                            value={newPatient.age} 
                            onChange={(e) => setNewPatient({ ...newPatient, age: parseInt(e.target.value) || 0 })}
                            class="w-full bg-white border border-slate-200 rounded p-1.5 text-xs text-slate-700" 
                          />
                        </div>
                        <div>
                          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Symptom</label>
                          <select 
                            value={newPatient.symptom} 
                            onChange={(e) => setNewPatient({ ...newPatient, symptom: e.target.value })}
                            class="w-full bg-white border border-slate-200 rounded p-1.5 text-xs text-slate-700">
                            <option value="Diarrhea">Diarrhea</option>
                            <option value="Fever">Fever</option>
                            <option value="Cough">Cough</option>
                          </select>
                        </div>
                        <button 
                          onClick={() => {
                            setLocalRecords([...localRecords, newPatient]);
                            const matchNum = parseInt(newPatient.patient_id.substring(1)) || 112;
                            setNewPatient({ patient_id: `P${matchNum+1}`, age: 22, hostel: "Hostel A", symptom: "Diarrhea" });
                          }}
                          class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold py-2 px-3 rounded shadow transition-colors">
                          Add Record
                        </button>
                      </div>
                    </div>

                    {/* Aggregation & Noise configurations */}
                    <div class="space-y-6">
                      <h4 class="text-sm font-bold text-slate-700 uppercase tracking-wide">Privacy Protection Engine & Payload Transmission</h4>
                      
                      <div class="grid grid-cols-3 gap-4 bg-slate-50 p-5 rounded-xl border border-slate-200">
                        <div>
                          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Epsilon (&epsilon;)</label>
                          <input 
                            type="number" 
                            step="0.1" 
                            min="0.1" 
                            max="10.0"
                            value={localNodeEpsilon}
                            onChange={(e) => setLocalNodeEpsilon(parseFloat(e.target.value) || 1.0)}
                            class="w-full bg-white border border-slate-200 rounded p-2 text-xs text-slate-700" 
                          />
                          <span class="text-[9px] text-slate-400 mt-1 block">Low &epsilon; = more noise (high privacy)</span>
                        </div>
                        
                        <div>
                          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Sensitivity</label>
                          <input 
                            type="number" 
                            step="0.5" 
                            min="0.5"
                            value={localNodeSensitivity}
                            onChange={(e) => setLocalNodeSensitivity(parseFloat(e.target.value) || 1.0)}
                            class="w-full bg-white border border-slate-200 rounded p-2 text-xs text-slate-700" 
                          />
                        </div>

                        <div>
                          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Min Group Size</label>
                          <input 
                            type="number" 
                            min="1"
                            value={localMinGroupSize}
                            onChange={(e) => setLocalMinGroupSize(parseInt(e.target.value) || 10)}
                            class="w-full bg-white border border-slate-200 rounded p-2 text-xs text-slate-700" 
                          />
                          <span class="text-[9px] text-slate-400 mt-1 block">Suppresses count if count &lt; threshold</span>
                        </div>
                      </div>

                      <div class="flex items-center space-x-3">
                        <label class="text-xs font-bold text-slate-500 uppercase">Target Area</label>
                        <select 
                          value={selectedArea}
                          onChange={(e) => setSelectedArea(e.target.value)}
                          class="bg-white border border-slate-200 rounded text-xs font-semibold py-1.5 px-3 text-slate-700 shadow-sm focus:outline-none">
                          {areas.map(a => (
                            <option key={a.id} value={a.id}>{a.name}</option>
                          ))}
                        </select>
                        <button 
                          onClick={handleLocalAggregateSubmit}
                          class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 px-4 rounded shadow-md transition-colors flex-grow">
                          Aggregate, Protect & Transmit Payload
                        </button>
                      </div>

                      {localAggregationResult && (
                        <div class="bg-slate-900 text-slate-100 p-5 rounded-xl border border-slate-800 font-mono text-xs space-y-3">
                          <p class="text-emerald-400 font-bold border-b border-slate-800 pb-2 flex items-center">
                            <span class="h-2 w-2 rounded-full bg-emerald-400 mr-2.5 animate-pulse"></span>
                            TRANSFERRED PAYLOAD TO ANALYTICS SERVER
                          </p>
                          <pre class="overflow-x-auto text-[11px] leading-relaxed">
                            {JSON.stringify(localAggregationResult, null, 2)}
                          </pre>
                          <p class="text-[10px] text-slate-400 italic">
                            Observe that names, room numbers, ages, and patient IDs are completely scrubbed. Output aggregates are Laplace-noised or SUPPRESSED.
                          </p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                {/* DP Math Sandbox */}
                <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-lg font-bold text-slate-800 mb-2">Differential Privacy Mathematical Sandbox</h3>
                  <p class="text-xs text-slate-400 mb-6">Experiment directly with Laplace distribution transformations. Generate noise on mock values dynamically.</p>

                  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
                    <div>
                      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Original Value</label>
                      <input 
                        type="number" 
                        value={dpInputValue} 
                        onChange={(e) => setDpInputValue(parseFloat(e.target.value) || 0)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-700 shadow-sm focus:outline-none" 
                      />
                    </div>
                    
                    <div>
                      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Epsilon (&epsilon;)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        min="0.1"
                        value={dpEpsilon} 
                        onChange={(e) => setDpEpsilon(parseFloat(e.target.value) || 1.0)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-700 shadow-sm focus:outline-none" 
                      />
                    </div>

                    <div>
                      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Sensitivity</label>
                      <input 
                        type="number" 
                        step="0.5" 
                        min="0.5"
                        value={dpSensitivity} 
                        onChange={(e) => setDpSensitivity(parseFloat(e.target.value) || 1.0)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-700 shadow-sm focus:outline-none" 
                      />
                    </div>

                    <button 
                      onClick={runDpMathDemo}
                      class="bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm py-2.5 rounded-lg shadow-md transition-colors">
                      Run DP Noise Calculator
                    </button>
                  </div>

                  {dpResult && (
                    <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 p-6 rounded-xl border border-slate-200 text-center font-mono">
                      <div>
                        <span class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">Original Count</span>
                        <span class="text-2xl font-bold text-slate-700">{dpResult.original_value}</span>
                      </div>
                      <div>
                        <span class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">Laplace Noise added</span>
                        <span class={`text-2xl font-bold ${dpResult.noise_added > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {dpResult.noise_added > 0 ? '+' : ''}{dpResult.noise_added}
                        </span>
                      </div>
                      <div>
                        <span class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">DP Protected Count</span>
                        <span class="text-2xl font-bold text-sky-600">{dpResult.protected_value}</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 font-medium">
            <div class="max-w-7xl mx-auto px-4">
              <p>SurakshaNet — Privacy-Preserving Community Health Anomaly Detection Platform Prototype</p>
              <p class="mt-1 text-[10px] text-slate-300">Smart India Hackathon 2026 • Simulated Demonstration Data</p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
